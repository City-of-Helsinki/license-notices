name: release-please

on:
  push:
    branches: [main]
  schedule:
    # Run daily to keep the release PR date current
    - cron: '1 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    uses: City-of-Helsinki/.github/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  # Publishes with npm trusted publishing (OIDC), so that no npm token is
  # stored in the repository. On npmjs.com, the package names this
  # repository and this workflow file as its trusted publisher.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

      # npm and not pnpm, because trusted publishing needs npm 11.5.1 or
      # newer. The prepack script builds the package.
      - name: Publish
        run: npm publish --provenance
